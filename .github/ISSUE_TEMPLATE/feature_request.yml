name: Feature request
description: Propose an improvement to omarchy-supplement.
title: "feat: "
labels:
  - enhancement
  - status:needs-review
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. Feature requests require maintainer approval before a pull request can be opened.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand this issue needs the `status:approved` label before a pull request can be opened.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe the pain point this feature would solve.
      placeholder: Explain who is affected and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how the improvement should work from the user's perspective.
      placeholder: Describe the expected behavior and outcome.
    validations:
      required: true
  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Select the primary area affected by this request.
      options:
        - Scripts
        - Skills
        - Examples
        - Documentation
        - CI/Workflows
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternatives, workarounds, or related approaches.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, references, or other useful details.
    validations:
      required: false
