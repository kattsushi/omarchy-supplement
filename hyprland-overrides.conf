# Hyprland configuration overrides
# ================================

$terminal = uwsm app -- ghostty
$browser = "chromium --force-device-scale-factor=0.8"


# ================================
# MONITORS (HDMI IZQUIERDA | ULTRAWIDE DERECHA)
# ================================

# Monitor izquierdo (HDMI 1080p)

monitor = HDMI-A-1,1920x1080@60, 0x0,1, transform, 3
# Monitor derecho (Ultrawide principal)
monitor = DP-2,3440x1440@144,1080x0, 1


# ================================
# WORKSPACES
# ================================

workspace = 1,monitor:DP-2,default:true
workspace = 2,monitor:DP-2
workspace = 3,monitor:DP-2
workspace = 4,monitor:DP-2

workspace = 5,monitor:HDMI-A-1
workspace = 6,monitor:HDMI-A-1


# ================================
# NVIDIA WAYLAND OVERRIDES (CRÍTICO)
# ================================

env = WLR_NO_HARDWARE_CURSORS,1
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct


# ================================
# RENDER / PERFORMANCE
# ================================

render {
    direct_scanout = true
}


# ================================
# WINDOW LAYOUT (ULTRAWIDE FRIENDLY)
# ================================

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = true
}


# ================================
# INPUT
# ================================

input {
    kb_options = ctrl:nocaps

    repeat_rate = 50
    repeat_delay = 220

    accel_profile = flat

    touchpad {
        scroll_factor = 0.4
    }
}


# ================================
# MISC
# ================================

misc {
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}


# ================================
# DECORATION
# ================================

decoration {
    rounding = 10
}


# ================================
# BINDS (tus overrides personalizados)
# ================================

unbind = SUPER, D
unbind = SUPER, G

bindd = SUPER, G, Notion, exec, omarchy-launch-webapp "https://www.notion.so/"
